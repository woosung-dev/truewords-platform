<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>훈독 데스크톱 시안 4안 비교 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
:root{--bg:#1a1917;--panel:#242220;--line:#3a3734;--txt:#efece7;--txt2:#a8a29a;--hi:#c24721}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 20px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
.hint{font-size:12.5px;color:var(--txt2)}
.screens{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.screens button{font:inherit;font-size:13px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);
  background:transparent;color:var(--txt2);cursor:pointer}
.screens button:hover{background:#2f2c29;color:var(--txt)}
.screens button.on{background:var(--hi);border-color:var(--hi);color:#fff;font-weight:600}
.opts{display:flex;gap:14px;align-items:center;margin-top:12px;font-size:13px;color:var(--txt2);flex-wrap:wrap}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px 20px 40px}
.grid.one{grid-template-columns:1fr}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cell.dim{opacity:.35}
.head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.sw{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(255,255,255,.15)}
.nm{font-size:14px;font-weight:700}
.meta{font-size:11.5px;color:var(--txt2)}
.score{margin-left:auto;font-size:12px;color:var(--txt2);font-variant-numeric:tabular-nums}
.score b{color:var(--txt);font-size:14px}
.open{font-size:12px;color:var(--txt2);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 9px}
.open:hover{color:var(--txt);background:#2f2c29}
.stage{position:relative;width:100%;overflow:hidden;background:#fff}
.stage iframe{width:1280px;height:900px;border:0;transform-origin:top left;display:block}
footer{padding:0 20px 40px;font-size:12.5px;color:var(--txt2);line-height:1.7}
footer b{color:var(--txt)}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>훈독 데스크톱 시안 4안</h1>
    <span class="hint">모두 1280px 실제 화면. 각 시안 안에서 클릭·탭 전환도 됩니다</span>
  </div>
  <div class="screens" id="screens"></div>
  <div class="opts">
    <label><input type="checkbox" id="clean" checked> 안 A 의 검증용 주석 숨기기 (공정 비교)</label>
    <label><input type="checkbox" id="solo"> 한 번에 한 안만 크게 보기</label>
    <span id="soloPick"></span>
  </div>
</header>

<div class="grid" id="grid"></div>

<footer>
  <b>심사 결과</b> — D 89.3 · C 80.0 · A 74.3 · B 73.3 (독립 블라인드 심사원 3명, 5축 × 20점).
  D 가 3표 만장일치 1위, C 가 3표 만장일치 2위.<br>
  <b>보는 법</b> — "우리 어머니가 이 화면을 편하게 읽으실까" 이 질문 하나로만 보세요.
  심사원 3명은 모두 AI 라 실사용자 관찰이 아닙니다.<br>
  모든 말씀·인물·교회·수치는 프로토타입용 예시입니다.
</footer>

<script>
const V = [
  {k:'A', nm:'A 아침 햇살', meta:'감귤 #c24721 · Pretendard 단일 · 모서리 16px · 좌측 레일', sw:'#c24721', file:'2026-09-16-hoondok-desktop.html', score:'74.3'},
  {k:'B', nm:'B 감청 편집', meta:'감청 #2a4a7c · Plex+Serif+Mono · 모서리 4px · 상단 내비', sw:'#2a4a7c', file:'2026-09-16-hoondok-desktop-b-gpt-taste.html', score:'73.3'},
  {k:'C', nm:'C 청화',      meta:'청자 #1e4d8c · Plex+Serif · 모서리 4px · 상단 내비',        sw:'#1e4d8c', file:'2026-09-16-hoondok-desktop-c-taste.html', score:'80.0'},
  {k:'D', nm:'D 솔잎 조판', meta:'솔잎 #2f6048 + 금 · Pretendard+Serif · 모서리 5px · 상단 내비', sw:'#2f6048', file:'2026-09-16-hoondok-desktop-d-uiux-promax.html', score:'89.3'},
];
const S = [
  ['오늘 훈독 (홈)','/today'], ['원문 뷰','/words/read'], ['질문·답변 상세','/ask/1'],
  ['말씀 서고','/words'], ['AI 질문 목록','/ask'], ['가정예배','/worship'],
  ['나의 정원','/me'], ['정성 만들기 (모달)','/today/jeongseong'],
];
let cur = '/today', soloKey = null;

const grid = document.getElementById('grid');
const screensEl = document.getElementById('screens');
const cleanEl = document.getElementById('clean');
const soloEl = document.getElementById('solo');
const soloPick = document.getElementById('soloPick');

S.forEach(([label, hash]) => {
  const b = document.createElement('button');
  b.textContent = label;
  b.onclick = () => { cur = hash; render(); };
  b.dataset.hash = hash;
  screensEl.appendChild(b);
});

function hideNotes(frame) {
  try {
    const d = frame.contentDocument;
    if (!d) return;
    let st = d.getElementById('__board_clean');
    if (cleanEl.checked) {
      if (!st) { st = d.createElement('style'); st.id = '__board_clean'; d.head.appendChild(st); }
      st.textContent = '.note{display:none !important}';
    } else if (st) { st.textContent = ''; }
  } catch (e) { /* file:// 동일 출처라 정상 동작 */ }
}

function fit() {
  document.querySelectorAll('.stage').forEach(st => {
    const s = st.clientWidth / 1280;
    const f = st.querySelector('iframe');
    f.style.transform = 'scale(' + s + ')';
    st.style.height = (900 * s) + 'px';
  });
}

function render() {
  grid.innerHTML = '';
  grid.classList.toggle('one', !!soloKey);
  const list = soloKey ? V.filter(v => v.k === soloKey) : V;
  list.forEach(v => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML =
      '<div class="head">' +
        '<span class="sw" style="background:' + v.sw + '"></span>' +
        '<span><span class="nm">' + v.nm + '</span><br><span class="meta">' + v.meta + '</span></span>' +
        '<span class="score">심사 <b>' + v.score + '</b></span>' +
        '<a class="open" href="' + v.file + '#' + cur + '" target="_blank" rel="noopener">따로 열기</a>' +
      '</div>' +
      '<div class="stage"><iframe src="' + v.file + '#' + cur + '" title="' + v.nm + '"></iframe></div>';
    cell.querySelector('.head').onclick = e => {
      if (e.target.closest('.open')) return;
      soloKey = soloKey ? null : v.k; soloEl.checked = !!soloKey; render();
    };
    grid.appendChild(cell);
    cell.querySelector('iframe').addEventListener('load', e => { hideNotes(e.target); fit(); });
  });
  [...screensEl.children].forEach(b => b.classList.toggle('on', b.dataset.hash === cur));
  soloPick.textContent = soloKey ? ('현재: 안 ' + soloKey + ' — 제목 줄을 다시 누르면 4안으로 돌아갑니다') : '제목 줄을 누르면 그 안만 크게 봅니다';
  fit();
}

cleanEl.onchange = () => document.querySelectorAll('iframe').forEach(hideNotes);
soloEl.onchange = () => { soloKey = soloEl.checked ? 'A' : null; render(); };
window.addEventListener('resize', fit);
render();
</script>
</body>
</html>
