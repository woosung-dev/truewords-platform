<style>
  /*
    안 A "아침 햇살" - 프로토타입용 정적 화면 6개.
    모든 말씀 인용은 저장소 featured_malssum.json 큐레이션이며, 읽기 화면 본문은 예시 요약이다.
    이름·교회·정성 일수·날짜는 예시. 강조색은 감(persimmon) 1색.
  */
  :root {
    --bg: #FFFBF6;
    --card: #FFFFFF;
    --ink: #23262F;
    --muted: #6E7280;
    --accent: #C2452B;
    --accent-soft: #FBEAE4;
    --line: #EFE7DF;
    --tint: #FFF1E8;
    --peach: #FFE9DA;
    --shadow: 0 6px 20px rgba(120, 80, 50, 0.08);
    --r-card: 20px;
    --r-input: 12px;
    --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    --serif: "Noto Serif KR", "Apple Myungjo", "Nanum Myeongjo", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #F1EDE7; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

  /* ---------- 보드 ---------- */
  .board-head { max-width: 1360px; margin: 0 auto; padding: 44px 40px 8px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; }

  .board-head p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 62ch; }
  .swatches { display: flex; gap: 8px; align-items: center; }
  .sw { width: 34px; height: 34px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.06); }
  .sw-label { font-size: 12px; color: var(--muted); margin-left: 4px; }
  .board { max-width: 1360px; margin: 0 auto; padding: 24px 40px 72px; display: grid; grid-template-columns: repeat(3, 393px); justify-content: space-between; row-gap: 56px; }
  @media (max-width: 1320px) { .board { grid-template-columns: repeat(2, 393px); justify-content: center; column-gap: 48px; } }
  @media (max-width: 920px) { .board { grid-template-columns: 393px; } .board-head { grid-template-columns: 1fr; } }
  figure.shot { margin: 0; }
  figcaption { margin: 22px 0 0 6px; font-size: 14px; font-weight: 600; }
  figcaption span { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 12px; }

  /* ---------- 기기 ---------- */

  .status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 28px 10px 34px; font-weight: 600; font-size: 16px; z-index: 6; }

  /* ---------- 화면 1 오늘 ---------- */

  .reader .hl { background: linear-gradient(transparent 62%, #FFD9C7 62%); }
  .term { display: inline; border-bottom: 1.5px dotted var(--accent); color: var(--ink); }
  .exnote { font-size: 11px; color: var(--muted); font-family: var(--sans); margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
  .sheet { position: absolute; left: 12px; right: 12px; bottom: 96px; background: var(--card); border-radius: var(--r-card); box-shadow: 0 -8px 30px rgba(60, 40, 20, 0.16); padding: 14px 18px 16px; z-index: 5; }

  .ai { border-radius: var(--r-card); padding: 12px 14px 14px; background: repeating-linear-gradient(135deg, #FFF7F1 0 6px, #FFFBF6 6px 12px); border: 1px dashed #E3D6C9; margin-bottom: 10px; }
  .ai p { margin: 6px 0 0; font-size: 14.5px; line-height: 1.65; }
  .ai p a { color: var(--accent); font-weight: 600; text-decoration: none; font-size: 12px; vertical-align: 2px; }
  .cite { background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 12px 14px 12px 16px; border-left: 4px solid var(--ink); margin-bottom: 10px; }

  .fade { position: absolute; left: 0; right: 0; bottom: 83px; height: 76px; background: linear-gradient(rgba(255,251,246,0), var(--bg) 55%); z-index: 4; }

  .ask { position: absolute; left: 12px; right: 12px; bottom: 92px; height: 50px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); display: flex; align-items: center; padding: 0 8px 0 18px; font-size: 14px; color: var(--muted); z-index: 5; }
  .ask i { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 18px; }

  /* ---------- 화면 4 서고 ---------- */
  .search { display: flex; align-items: center; gap: 10px; height: 46px; border-radius: var(--r-input); background: var(--card); box-shadow: var(--shadow); padding: 0 14px; font-size: 15px; color: var(--muted); margin-bottom: 10px; }
  .search i { font-size: 20px; color: var(--accent); }
  .chips { display: flex; gap: 8px; overflow: hidden; margin-bottom: 14px; }
  .h2 { font-size: 15px; font-weight: 700; margin: 4px 0 10px; display: flex; align-items: center; }
  .h2 span { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--accent); }
  .lib { background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 4px 16px; margin-bottom: 12px; }
  .lib .row { padding: 11px 0; border-bottom: 1px solid var(--line); }

  /* ---------- 화면 5 가정 ---------- */
  .week { display: flex; justify-content: space-between; margin: 10px 0 12px; }

<body>

<header class="board-head">
  <div>
    <h1>훈독(가안) · 안 A 아침 햇살</h1>
    <p>아침 훈독회의 밝은 창가. 초원 사용자가 바로 알아보는 카드 루틴을 iOS 문법으로 옮겼다. 강조색은 감(persimmon) 한 가지, 말씀 본문만 명조. 화면 속 이름·교회·일수는 예시이고 말씀 인용은 저장소 큐레이션 카드다.</p>
  </div>
  <div class="swatches">
    <span class="sw" style="background:#FFFBF6"></span>
    <span class="sw" style="background:#FFE9DA"></span>
    <span class="sw" style="background:#C2452B"></span>
    <span class="sw" style="background:#23262F"></span>
    <span class="sw-label">Pretendard + Noto Serif KR</span>
  </div>
</header>

<main class="board">

<!-- ================= 1 오늘 ================= -->
<figure class="shot" id="s1">
<div class="device">
  <div class="island"></div>
  <div class="status"><span>9:41</span><span class="r"><i class="ph-fill ph-cell-signal-full"></i><i class="ph-fill ph-wifi-high"></i><i class="ph-fill ph-battery-full"></i></span></div>
  <div class="content">
    <div class="beta">독립 운영 베타, 가정연합 공식 앱이 아닙니다</div>
    <div class="hero">
      <div class="date">9월 9일 수요일</div>
      <h1 class="lt">좋은 아침이에요,<br>민준 식구님</h1>
      <div style="display:flex;gap:8px">
        <span class="pill accent"><i class="ph-fill ph-check-circle"></i>정성 12일째</span>
        <span class="pill"><i class="ph ph-users-three"></i>우리 가정 3명 훈독</span>
      </div>
    </div>
    <div class="quick">
      <div><i class="ph ph-magnifying-glass"></i>말씀 검색</div>
      <div><i class="ph ph-calendar-check"></i>정성 기간</div>
      <div><i class="ph ph-scroll"></i>가정맹세</div>
      <div><i class="ph ph-book-bookmark"></i>용어 사전</div>
