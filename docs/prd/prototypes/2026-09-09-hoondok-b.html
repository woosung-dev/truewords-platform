<header class="board-head">
  <div>
    <h1>훈독(가안) · 안 B 한지와 먹</h1>
    <p>서책과 먹선. 말씀을 "읽는 책"으로 대하는 차분한 편집 디자인이다. 종이 바탕과 명조 제목, 1px 먹선으로 나누고 강조색은 쪽빛 한 가지. 오늘 섹션과 인용에만 살구 틴트를 깐다. 이름·교회·일수는 예시, 말씀 인용은 저장소 큐레이션 카드다.</p>
  </div>
  <div class="swatches">
    <span class="sw" style="background:#F4F3EF"></span>

    <span class="sw" style="background:#34518A"></span>
    <span class="sw" style="background:#2A2724"></span>
    <span class="sw-label">Noto Serif KR + Pretendard</span>
  </div>
</header>

  <div class="content">
    <div class="beta">독립 운영 베타, 가정연합 공식 앱이 아닙니다</div>
    <div class="date">9월 9일 수요일, 아침 훈독</div>
    <div class="greet">좋은 아침이에요,<br>민준 식구님</div>
