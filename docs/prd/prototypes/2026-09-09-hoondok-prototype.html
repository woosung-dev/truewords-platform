<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>훈독 — 가정연합 말씀 PWA 프로토타입 (루프3 최종 (v3))</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============ 토큰 (UI-HOONDOK-001 · 새벽 Dawn) ============ */
:root{
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --serif:"Noto Serif KR","Apple Myungjo",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shell-bg:#E9E6E0;--shell-ink:#1F1E1C;--shell-muted:#6B6864;--shell-line:#D6D2CA;--shell-surface:#FFFFFF;
}
.app{
  --bg:#F6F1E8;--surface:#FFFDF9;--surface-2:#EFE9DE;--ink:#1F1B2E;--ink-2:#3E3956;--muted:#6E6880;
  --line:#E4DDD0;--line-strong:#C3BBAC;--primary:#2E2A5A;--on-primary:#FBF7EE;--primary-soft:#E7E4F2;
  --accent:#C8892A;--accent-ink:#8A5A12;--accent-soft:#F5E6C8;--success:#2E7D5E;--success-soft:#DDEFE6;--danger:#B23F2A;--danger-soft:#F6E0DB;
  --dawn-a:#2E2A5A;--dawn-b:#4A3E78;--dawn-c:#C8892A;
  --r-lg:20px;--r-md:14px;--r-sm:10px;--r-pill:999px;
  --sh-card:0 6px 18px -12px rgba(46,42,90,.28);--sh-float:0 16px 40px -16px rgba(31,27,46,.45);
  --fs-body:15px;--fs-scripture:18px;--lh-scripture:1.9;--fs-meta:12px;
  --dur:220ms;--ease:cubic-bezier(.2,.7,.2,1);
}
.app[data-theme=dark]{
  --bg:#15132A;--surface:#1E1B36;--surface-2:#282544;--ink:#F2ECE0;--ink-2:#D9D2C4;--muted:#A9A3BE;
  --line:#35314F;--line-strong:#4E4970;--primary:#E3B45C;--on-primary:#1B1730;--primary-soft:#2F2A50;
  --accent:#E0A94F;--accent-ink:#F0C877;--accent-soft:#3A3050;--success:#7FC7A4;--success-soft:#20362E;--danger:#F09A88;--danger-soft:#43272A;
  --dawn-a:#1B1834;--dawn-b:#3A3068;--dawn-c:#C8892A;
  --sh-card:0 6px 18px -12px rgba(0,0,0,.6);--sh-float:0 16px 40px -16px rgba(0,0,0,.7);
}
.app[data-big]{--fs-body:17px;--fs-scripture:22px;--lh-scripture:2;--fs-meta:14px}
.app[data-big] .meta.mono{font-size:13px;line-height:1.7}
.app[data-big] .chip{font-size:15px;min-height:42px}
.app[data-big] .tabbar a{font-size:12.5px}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--shell-bg);color:var(--shell-ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ============ 데스크톱 쉘 ============ */
.shell{display:grid;grid-template-columns:260px 1fr 320px;height:100vh}
.side{background:var(--shell-surface);border-right:1px solid var(--shell-line);padding:20px 16px;overflow:auto}
.side h1{font-size:17px;font-weight:800;letter-spacing:-.01em}
.side h1 small{display:block;font:500 11px/1.5 var(--mono);color:var(--shell-muted);letter-spacing:.03em;margin-top:4px}
.side .grp{font:600 10.5px/1 var(--mono);letter-spacing:.06em;color:var(--shell-muted);margin:18px 4px 6px}
.side nav a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;font-size:13.5px;color:var(--shell-ink)}
.side nav a:hover{background:#F3F1EC}
.side nav a.on{background:#1F1B2E;color:#F6F1E8}
.side nav a code{margin-left:auto;font:500 10px var(--mono);color:inherit;opacity:.55}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;position:relative}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ctl button,.ctl label{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--shell-line);background:#fff;font-size:12.5px;font-weight:500;cursor:pointer}
.ctl button[aria-pressed=true]{background:#1F1B2E;color:#F6F1E8;border-color:#1F1B2E}
.notes{background:var(--shell-surface);border-left:1px solid var(--shell-line);padding:20px 18px;overflow:auto;font-size:13px;line-height:1.6}
.notes h2{font-size:15px;font-weight:700;margin-bottom:4px}
.notes .req{font:500 11px/1.6 var(--mono);color:var(--shell-muted);margin-bottom:12px}
.notes h3{font-size:12px;font-weight:700;color:var(--shell-muted);margin:14px 0 4px;letter-spacing:.02em}
.notes ul{padding-left:16px}
.notes li{margin-bottom:3px}
.notes .kbd{font:500 11px var(--mono);border:1px solid var(--shell-line);border-radius:4px;padding:1px 5px}

/* ============ 폰 프레임 ============ */
.frame{width:390px;height:844px;border-radius:48px;position:relative;box-shadow:0 30px 70px -30px rgba(20,18,30,.6),0 0 0 10px #17161B,0 0 0 11px #3A383F;overflow:hidden;flex:none}
.frame .island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#0B0B0E;z-index:50}
.app{position:absolute;inset:0;background:var(--bg);color:var(--ink);font-size:var(--fs-body);line-height:1.55;display:flex;flex-direction:column;transition:background var(--dur),color var(--dur)}
.status{height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px;font:600 14px var(--mono);letter-spacing:.01em}
.beta{flex:none;font:500 10.5px/1 var(--mono);letter-spacing:.03em;color:var(--muted);text-align:center;padding:4px 0 6px;border-bottom:1px solid var(--line)}
.screens{flex:1;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;padding:0 18px 28px;display:none;scrollbar-width:none}
.scr:has(.fab){padding-bottom:110px}
.scr::-webkit-scrollbar{display:none}
.scr.on{display:block;animation:in var(--dur) var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tabbar{flex:none;height:78px;display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:14px}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);min-height:44px}
.tabbar a.on{color:var(--primary)}
.tabbar a.on svg{stroke-width:2.2}
.app[data-hide-tabs] .tabbar{display:none}

/* ============ 공통 컴포넌트 ============ */
.appbar{display:flex;align-items:center;gap:10px;padding:10px 0 8px;position:sticky;top:0;background:var(--bg);z-index:5}
.appbar .back{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-left:-8px}
.appbar .back:hover{background:var(--surface-2)}
.appbar h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.appbar .sp{flex:1}
.appbar .chip{font:500 11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-card);margin-bottom:12px}
.card.flat{box-shadow:none}
.src{font:500 var(--fs-meta)/1.5 var(--sans);color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;font:600 10.5px/1 var(--mono);letter-spacing:.02em;padding:4px 6px;border-radius:5px;border:1px solid var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.badge.o2{border-color:var(--line-strong);color:var(--ink-2);background:var(--surface-2)}
.badge.r{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.badge.ai{border-style:dashed;border-color:var(--line-strong);color:var(--muted);background:transparent}
.badge.note{border-style:dotted;border-color:var(--line-strong);color:var(--ink-2);background:transparent}
.scripture{font-family:var(--serif);font-size:var(--fs-scripture);line-height:var(--lh-scripture);letter-spacing:-.005em;color:var(--ink);border-left:3px solid var(--accent);padding-left:14px;margin:12px 0 10px;word-break:keep-all}
.why{font-size:var(--fs-meta);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:var(--r-md);font-size:15px;font-weight:600;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);transition:transform var(--dur) var(--ease),background var(--dur)}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.s{background:var(--surface-2);border-color:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px;border-radius:var(--r-sm)}
.btn.full{width:100%}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;transition:all var(--dur)}
.chip[aria-pressed=true]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.h{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.h .sp{flex:1}
.h a{font-size:12.5px;font-weight:500;color:var(--primary)}
.week{display:flex;align-items:center;gap:8px;font-size:var(--fs-meta);color:var(--muted);padding:2px 2px}
.week i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-strong)}
.week i.f{background:var(--accent);border-color:var(--accent)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick a{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 4px 10px;text-align:center;font-size:12px;font-weight:600;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;min-height:44px}
.quick a svg{stroke:var(--primary)}
.layer{border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px;font-size:var(--fs-body);line-height:1.6}
.layer .lbl{font:600 11px/1 var(--mono);letter-spacing:.04em;margin-bottom:8px;display:flex;gap:8px;align-items:center;color:var(--muted)}
.layer.ai{border:1.5px dashed var(--line-strong);background:var(--surface)}
.layer.src{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);font-family:var(--serif);font-size:calc(var(--fs-scripture) - 2px);line-height:1.8}
.layer.expl{border:1px solid var(--line);background:var(--surface-2)}
.layer.note{border:1.5px dotted var(--line-strong);background:var(--surface)}
.layer.stop{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.meta{font:500 var(--fs-meta)/1.6 var(--sans);color:var(--muted)}
.meta.mono{font-family:var(--mono);font-size:calc(var(--fs-meta) - 1px)}
.q{align-self:flex-end;max-width:84%;background:var(--primary);color:var(--on-primary);padding:11px 14px;border-radius:18px 18px 4px 18px;margin:6px 0 12px auto;line-height:1.5}
.input{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-pill);padding:6px 6px 6px 16px;color:var(--muted);font-size:15px;position:sticky;bottom:0}
.input .send{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#1F1B2E;display:flex;align-items:center;justify-content:center;flex:none}
.input.ta{align-items:flex-end;border-radius:22px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.item .ic{width:36px;height:36px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--primary)}
.item .t{font-weight:600}
.item .d{font-size:var(--fs-meta);color:var(--muted);margin-top:2px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.app[data-theme=dark] .avatar{color:var(--ink)}
.toggle{width:46px;height:28px;border-radius:999px;background:var(--line-strong);position:relative;flex:none;transition:background var(--dur)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform var(--dur) var(--ease)}
.toggle[aria-checked=true]{background:var(--success)}
.toggle[aria-checked=true]::after{transform:translateX(18px)}
.setting{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setting .t{flex:1}
.setting .t small{display:block;font-size:var(--fs-meta);color:var(--muted)}
.divider{height:1px;background:var(--line);margin:14px 0}
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:14px}
.empty svg{stroke:var(--line-strong);width:36px;height:36px;margin-bottom:8px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);margin-right:4px}
.tag.ok{background:var(--success-soft);color:var(--success)}
.tag.warn{background:var(--accent-soft);color:var(--accent-ink)}
.tag.off{background:var(--danger-soft);color:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.stat b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--primary)}
.stat span{font-size:var(--fs-meta);color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{flex:1;min-height:36px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-card)}

/* 홈 히어로 */
.hero{margin:4px -18px 14px;padding:14px 20px 16px;background:linear-gradient(160deg,var(--dawn-a) 0%,var(--dawn-b) 50%,var(--dawn-c) 135%);color:#FBF7EE;border-radius:0 0 26px 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,220,150,.35),transparent 65%)}
.hero .t{font:500 11.5px var(--mono);letter-spacing:.06em;opacity:.85}
.hero h3{font-family:var(--serif);font-size:22px;font-weight:600;margin-top:6px;letter-spacing:-.01em}
.hero p{font-size:13.5px;opacity:.9;margin-top:4px}
.hero .greet{position:absolute;right:18px;top:16px;font-size:12px;opacity:.85}

/* 시트 & 토스트 */
.sheet-bg{position:absolute;inset:0;background:rgba(20,18,30,.45);opacity:0;pointer-events:none;transition:opacity var(--dur);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 20px 34px;transform:translateY(105%);transition:transform var(--dur) var(--ease);z-index:21;max-height:82%;overflow:auto;box-shadow:var(--sh-float)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line-strong);margin:0 auto 14px}
.sheet h4{font-size:17px;font-weight:700;margin-bottom:4px}
.app[data-sheet] .sheet-bg{opacity:1;pointer-events:auto}
.app[data-sheet] .sheet.on{transform:none}
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:500;opacity:0;transition:all var(--dur) var(--ease);z-index:30;white-space:nowrap;box-shadow:var(--sh-float)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 온보딩 */
.ob{display:flex;flex-direction:column;min-height:100%;padding-top:20px}
.ob .dots{display:flex;gap:6px;margin-bottom:24px}
.ob .dots i{width:20px;height:4px;border-radius:2px;background:var(--line)}
.ob .dots i.on{background:var(--primary)}
.ob h2{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.ob p{color:var(--muted);margin-top:8px;font-size:14.5px}
.ob .mood{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:24px 0 16px}
.ob .mood button{min-height:72px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;transition:all var(--dur)}
.ob .mood button em{font-style:normal;font-size:22px}
.ob .mood button[aria-pressed=true]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.ob .free{border:1px solid var(--line-strong);border-radius:var(--r-md);padding:12px 14px;color:var(--muted);background:var(--surface);min-height:56px;font-size:14.5px}
.ob .foot{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:10px}
.ob .skip{text-align:center;color:var(--muted);font-size:14px;min-height:44px;display:flex;align-items:center;justify-content:center}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center;background:linear-gradient(180deg,var(--dawn-a),var(--dawn-b) 55%,#8A6B3A 100%);margin:0 -18px;padding:0 24px;color:#FBF7EE}
.splash .mark{width:88px;height:88px;border-radius:28px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.splash h1{font-family:var(--serif);font-size:40px;font-weight:600;letter-spacing:.08em}
.splash p{opacity:.85;margin-top:8px;font-size:15px}
.splash .btn{margin-top:36px;width:100%;background:#FBF7EE;color:#1F1B2E;border-color:transparent}
.splash .btn.ghost{background:transparent;color:#FBF7EE;border-color:rgba(255,255,255,.35);margin-top:10px}
.splash small{display:block;margin-top:22px;font:500 11px var(--mono);letter-spacing:.04em;opacity:.7}

/* 말씀 카드 */
.deck{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:8px -18px 0;padding:6px 18px 12px;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.wcard{flex:none;width:318px;aspect-ratio:9/16;border-radius:24px;scroll-snap-align:center;position:relative;padding:26px 24px;display:flex;flex-direction:column;color:#FBF7EE;overflow:hidden;box-shadow:var(--sh-float)}
.wcard.dawn{background:linear-gradient(165deg,#2E2A5A,#4A3E78 55%,#C8892A 150%)}
.wcard.paper{background:#FBF7EE;color:#1F1B2E;border:1px solid #E4DDD0}
.wcard.night{background:radial-gradient(circle at 30% 20%,#3A3068,#15132A 70%)}
.wcard .k{font:500 11px var(--mono);letter-spacing:.08em;opacity:.8}
.wcard .body{font-family:var(--serif);font-size:24px;line-height:1.75;font-weight:500;margin:auto 0;letter-spacing:-.01em;word-break:keep-all}
.wcard .f{font-size:12px;opacity:.85;border-top:1px solid rgba(255,255,255,.25);padding-top:12px;display:flex;flex-direction:column;gap:3px}
.wcard.paper .f{border-color:#E4DDD0}
.wcard .badge{position:absolute;top:22px;right:22px}
.wcard .lock{position:absolute;inset:0;background:rgba(20,18,30,.55);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-size:13px;text-align:center;padding:24px;backdrop-filter:blur(2px)}

/* 나눔 */
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:10px}
.post .who{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post .who b{display:block;font-size:14.5px}

.post .txt{font-size:15px;line-height:1.6}
.react{display:flex;gap:6px;margin-top:12px}
.react button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;background:var(--surface)}
.react button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.fab{position:absolute;right:18px;bottom:96px;width:56px;height:56px;border-radius:18px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-float);z-index:6}

/* 기도제목 */
.pray{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.pray .st{width:10px;height:10px;border-radius:50%;margin-top:8px;flex:none;background:var(--accent)}
.pray .st.ans{background:var(--success)}
.pray .st.arc{background:var(--line-strong)}
.pray .t{flex:1}
.pray .t b{display:block;font-size:15px}
.pray .t small{color:var(--muted);font-size:12.5px}
.pray .act{display:flex;gap:6px;margin-top:8px}

/* 캘린더 */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px}
.cal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:700;font-size:16px}
.cal .mh small{display:block;font:500 11px var(--mono);color:var(--muted);letter-spacing:.03em}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .g .w{font:600 11px var(--mono);color:var(--muted);padding:4px 0}
.cal .g .d{height:46px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13.5px;font-weight:500;position:relative}
.cal .g .d small{font:400 9px var(--mono);color:var(--muted);letter-spacing:0}
.cal .g .d.dim{opacity:.35}
.cal .g .d.today{background:var(--primary);color:var(--on-primary)}
.cal .g .d.today small{color:inherit;opacity:.8}
.cal .g .d.ev::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.cal .g .d.hol{color:var(--danger)}

/* 알림 미리보기 */
.lock{background:linear-gradient(180deg,#2C2A45,#15132A);border-radius:var(--r-lg);padding:18px 16px;color:#FBF7EE;margin-bottom:12px}
.lock .time{font:300 44px/1 var(--sans);letter-spacing:-.02em;text-align:center;margin:4px 0 14px}
.lock .n{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;backdrop-filter:blur(8px)}
.lock .n .ico{width:34px;height:34px;border-radius:9px;background:#C8892A;display:flex;align-items:center;justify-content:center;color:#1F1B2E;flex:none}
.lock .n b{display:block;font-size:13.5px}
.lock .n span{font-size:12.5px;opacity:.85}
.lock .n small{margin-left:auto;font-size:11px;opacity:.6}

.stream{white-space:pre-wrap}
.cursor{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{to{opacity:0}}
.term-link{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;color:var(--primary);font-weight:600;cursor:pointer}

const app=document.getElementById('app'),screensEl=document.getElementById('screens'),tabbar=document.getElementById('tabbar'),notesEl=document.getElementById('notes'),navEl=document.getElementById('nav');
function render(id){closeSheet();

  navEl.innerHTML=(()=>{let g='',o='';SCREENS.forEach(x=>{if(x.grp!==g){g=x.grp;o+=`<div class="grp">${g}</div>`}o+=`<a data-go="${x.id}" class="${x.id===s.id?'on':''}">${x.name}<code>${x.id}</code></a>`});return o})();
  notesEl.innerHTML=`<h2>${s.name}</h2><div class="req">${s.req}</div><p>${s.notes.why}</p><h3>이 화면에서 해 볼 것</h3><ul>${s.notes.how.map(h=>`<li>${h}</li>`).join('')}</ul><h3>검증 가설</h3><p>${s.notes.hyp}</p><h3>공통 규칙</h3><ul><li>AI 설명(점선) · 공식 원문(굵은 왼쪽 선) · 공식 해설(면) · 내 메모(점) — 색만으로 구분하지 않음</li><li>연속 기록·점수·순위·달란트 없음</li><li>모든 말씀·인물·날짜는 프로토타입용 예시</li></ul><h3>단축키</h3><p><span class="kbd">D</span> 다크 · <span class="kbd">B</span> 큰 글씨 · <span class="kbd">←</span> 이전 화면</p>`;
  if(s.id==='source')renderLayer('src'),renderVer('single');
  if(s.id==='install')renderPlat('ios');
  history_push(s.id);
}

function closeSheet(){app.removeAttribute('data-sheet');document.getElementById('sheet').classList.remove('on')}
function renderLayer(k){const b=document.getElementById('layerBody');if(!b)return;const map={
 src:`<div class="layer src"><div class="lbl"><span class="badge">O1 정본</span> 공식 원문</div>감사하는 마음은 하루의 문을 여는 열쇠와 같습니다. 작은 것에서 시작하십시오.<div class="meta" style="margin-top:6px;font-family:var(--sans)">《예시 말씀선집》 12권 · 한국어 3판 · 검수 2026-08-20</div></div>`,
 expl:`<div class="layer expl"><div class="lbl"><span class="badge o2">O3 공식 해설</span> 예시 교육원 · 2015</div>이 문단은 아침 훈독 자세를 다루는 12권 3장의 도입부로, ‘감사’를 조건이 아닌 관계의 표현으로 설명한다. (예시 해설)</div>`,
 ai:`<div class="layer ai"><div class="lbl"><span class="badge ai">AI 설명</span> 공식 해석 아님</div>위 문단은 감사를 ‘세는 일’과 ‘기억하는 일’로 대비합니다. 관련 용어 <span class="term-link" data-term="감사">감사</span>의 판본별 정의를 함께 보면 표현 차이를 확인할 수 있습니다.</div>`,
 note:`<div class="layer note"><div class="lbl"><span class="badge note">내 메모</span> 비공개 · 나만 보기</div>출근길에 세 가지 감사 떠올리기. 아이들과 저녁에 다시 읽기.<div class="meta" style="margin-top:6px">2026-09-09 · 삭제 가능 · 그룹에 공유되지 않음</div></div>`};b.innerHTML=map[k]}
function renderVer(v){const b=document.getElementById('verBody');if(!b)return;if(v==='side'){b.innerHTML=`<div class="grid2"><div class="layer src" style="margin:0"><div class="lbl">한국어 3판 · 2009</div>감사하는 마음은 하루의 문을 여는 열쇠와 같습니다.</div><div class="layer src" style="margin:0;border-left-color:var(--line-strong)"><div class="lbl">한국어 초판 · 1988</div>감사하는 마음은 하루의 문을 여는 열쇠입니다.</div></div><p class="meta" style="margin-top:8px">판본 차이는 나란히 보여 주고 자동으로 한쪽을 고르지 않아요. 두 판본 모두 O1 정본입니다.</p>`}
 else{b.innerHTML=`<p class="meta" style="margin-bottom:4px">앞 문단</p><p style="color:var(--muted);font-family:var(--serif);font-size:15px;line-height:1.8">…하루를 시작할 때 무엇을 먼저 떠올리는가가 그 하루를 결정합니다.</p><div class="scripture">감사하는 마음은 하루의 문을 여는 열쇠와 같습니다. 작은 것에서 시작하십시오. <span class="term-link" data-term="감사">감사</span>는 받은 것을 세는 일이 아니라 주신 분을 기억하는 일입니다.</div><p class="meta" style="margin-bottom:4px">뒤 문단</p><p style="color:var(--muted);font-family:var(--serif);font-size:15px;line-height:1.8">그러므로 아침 <span class="term-link" data-term="훈독">훈독</span>은 지식을 얻는 시간이 아니라 마음을 정돈하는 시간입니다…</p>`}}
function renderPlat(p){const b=document.getElementById('platBody');if(!b)return;b.innerHTML=p==='ios'?`<div class="list">
 <div class="item"><div class="ic">${I.shareios}</div><div><div class="t">1. Safari 하단의 공유 버튼</div><div class="d">Chrome 등 다른 브라우저에서는 Safari 로 열어 주세요</div></div></div>
 <div class="item"><div class="ic">${I.plus}</div><div><div class="t">2. “홈 화면에 추가”</div><div class="d">iOS 26 은 “웹 앱으로 열기” 옵션도 보여요</div></div></div>
 <div class="item"><div class="ic">${I.home}</div><div><div class="t">3. 홈 화면의 ‘훈독’ 아이콘으로 열기</div><div class="d">이때부터 알림을 켤 수 있어요 (iOS 16.4+)</div></div></div></div>`:
 `<div class="card" style="text-align:center"><button class="btn p full" data-installed>${I.download} 설치</button><p class="meta" style="margin-top:10px">Chrome·Edge 가 설치 창을 띄워요. 알림은 설치 없이도 켤 수 있어요.</p></div>`}
function termSheet(t){const d=TERMS[t]||TERMS['감사'];sheet(`<h4>${t} <span class="badge o2" style="vertical-align:middle">정의 ${d.d.length}</span></h4><p class="meta">판본별 정의를 나란히 보여 줘요. 자동으로 하나를 고르지 않아요.</p>
 ${d.d.map(x=>`<div class="layer expl" style="margin-top:10px"><div class="lbl">${x[0]}</div>${x[1]}</div>`).join('')}
 <div class="h">관련 원문</div><div class="item" data-go="source" data-close><div class="ic">${I.book}</div><div><div class="t" style="font-family:var(--serif);font-weight:500">${d.rel}</div><div class="d">탭하면 원문으로 이동</div></div></div>
 <button class="btn s full" style="margin-top:14px" data-close>닫기</button>`)}
function practiceSheet(){sheet(`<h4>한 줄 실천</h4><p class="meta">오늘 할 수 있는 한 가지를 적어요. 저장 여부는 지금 골라요.</p>
 <div class="free" style="border:1px solid var(--line-strong);border-radius:14px;padding:12px 14px;margin:14px 0;color:var(--ink)">출근길에 세 가지 감사 떠올리기</div>
 <div class="row"><button class="btn" data-close data-nosave>저장 안 함</button><button class="btn p" data-close data-save="한 줄 실천">서재에 저장</button></div>
 <p class="meta" style="margin-top:12px">저장하면 나만 볼 수 있어요. 그룹에 공유하려면 나눔에서 따로 올려요.</p>`)}
function permSheet(){sheet(`<h4>hoondok.example 에서 알림을 보내려고 합니다</h4><p class="meta">브라우저 권한 창 시뮬레이션. 실제로는 OS·브라우저가 띄워요.</p>
 <div class="lock" style="margin:14px 0"><div class="n"><div class="ico">${I.sun}</div><div><b>훈독</b><span>오늘의 읽을거리가 준비됐어요</span></div><small>미리보기</small></div></div>
 <div class="row"><button class="btn" data-close data-perm-set="denied">차단</button><button class="btn p" data-close data-perm-set="granted">허용</button></div>`)}
function postSheet(){sheet(`<h4>나눔 올리기</h4><p class="meta">은혜가정 소그룹 7명에게만 보여요.</p>
 <div class="seg" style="margin:12px 0"><button aria-pressed="true">말씀 인용</button><button aria-pressed="false">글</button><button aria-pressed="false">기도제목</button></div>
 <div class="layer src" style="margin:0 0 10px"><div class="lbl"><span class="badge">O1</span> 오늘의 문단 · 출처 자동 첨부</div>감사하는 마음은 하루의 문을 여는 열쇠와 같습니다.</div>
 <div class="free" style="border:1px solid var(--line-strong);border-radius:14px;padding:12px 14px;color:var(--muted);min-height:70px">나누고 싶은 이야기…</div>
 <div class="row" style="margin-top:14px"><button class="btn" data-close>취소</button><button class="btn p" data-close data-toast="그룹에 올렸어요">올리기</button></div>`)}
function prayerSheet(){sheet(`<h4>기도제목 올리기</h4><p class="meta">그룹 안에서만 보이고, 잠금 화면 알림에는 내용이 나가지 않아요.</p>
 <div class="free" style="border:1px solid var(--line-strong);border-radius:14px;padding:12px 14px;color:var(--muted);min-height:70px;margin:12px 0">기도제목…</div>
 <div class="setting"><div class="t">월요일 리마인더<small>나에게만</small></div><button class="toggle" aria-checked="true" data-toggle-sw></button></div>
 <div class="row" style="margin-top:14px"><button class="btn" data-close>취소</button><button class="btn p" data-close data-add-prayer>올리기</button></div>`)}
function notifyOffer(){sheet(`<h4>내일도 이 시간에 알려 드릴까요?</h4><p class="meta">첫 저장을 마쳤어요. 알림은 잠금 화면에 중립 문구만 보여 주고, 언제든 끌 수 있어요.</p>
 <div class="lock" style="margin:14px 0"><div class="n"><div class="ico">${I.sun}</div><div><b>훈독</b><span>오늘의 읽을거리가 준비됐어요</span></div><small>06:00</small></div></div>
 <div class="row"><button class="btn" data-close>나중에</button><button class="btn p" data-close data-go="notify">알림 설정 보기</button></div>`)}
function stream(el,text,after){el.innerHTML='<span class="stream"></span><span class="cursor"></span>';const s=el.querySelector('.stream');let i=0;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce){s.textContent=text;el.querySelector('.cursor').remove();after&&after();return}
 const iv=setInterval(()=>{s.textContent=text.slice(0,i+=2);if(i>=text.length){clearInterval(iv);el.querySelector('.cursor')?.remove();after&&after()}},18)}
function ask(q){const b=document.getElementById('askBody');if(!b)return;b.innerHTML=`<div class="q">${q}</div>
 <div class="layer src"><div class="lbl"><span class="badge">O1 정본</span> 공식 원문 · 인용 문단</div>심정은 사랑을 통해 기쁨을 얻고자 하는 정적인 충동입니다. (예시 문장)<div class="meta" style="margin-top:6px;font-family:var(--sans)">예시 화자 · 《예시 원리 해설》 1장 · 한국어 1996 판 · 검수 2026-08-20 · <span class="term-link" data-go="source">원문 보기</span></div></div>
 <div class="layer ai"><div class="lbl"><span class="badge ai">AI 설명</span> 공식 해석 아님</div><div id="aiText"></div></div>`;
 stream(document.getElementById('aiText'),'위 문단에서 심정은 일시적 감정이 아니라 사랑하려는 근원적 충동으로 설명됩니다. 감정과의 차이는 판본에 따라 표현이 조금 다르므로, 용어 ‘심정’의 정의 2건을 나란히 확인해 보세요. 이 설명은 인용 문단을 넘어서는 주장을 하지 않습니다.',()=>{
  b.insertAdjacentHTML('beforeend',`<div class="row" style="margin-top:4px"><button class="btn sm" data-term="심정">용어 ‘심정’</button><button class="btn sm" data-go="source">원문으로</button><button class="btn sm p" data-sheet="practice">오늘 실천으로</button></div><p class="meta" style="margin-top:10px">${state.memory?'이 대화는 서재에 저장돼요.':'이 대화는 저장되지 않아요. 저장하려면 서재에서 기억하기를 켜세요.'}</p>`)})}

/* ---------------- 이벤트 (위임) ---------------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-mood],[data-term],[data-sheet],[data-save],[data-nosave],[data-close],[data-toggle],[data-react],[data-pray],[data-rsvp],[data-memory],[data-perm],[data-perm-set],[data-installed],[data-plat],[data-ver],[data-layer],[data-wording],[data-ask],[data-share],[data-sum],[data-add-prayer],[data-toggle-sw],[data-toast]');if(!t)return;
 const d=t.dataset;
 if('close' in d)closeSheet();
 if(d.toast)toast(d.toast);
 if(d.mood){state.mood=d.mood;const cur=app.dataset.screen;if(cur==='home')render('home');else document.querySelectorAll('[data-mood]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mood===d.mood));return}
 if(d.term){termSheet(d.term);return}
 if(d.sheet==='practice'){practiceSheet();return}
 if(d.sheet==='post'){postSheet();return}
 if(d.sheet==='prayer'){prayerSheet();return}
 if('save' in d){state.saved.unshift(d.save);toast('서재에 저장했어요 (비공개)');if(d.save==='한 줄 실천'&&state.perm==='default'&&!state._offered){state._offered=true;setTimeout(notifyOffer,900)}return}
 if('nosave' in d){toast('저장하지 않았어요');return}
 if('toggle' in d){t.setAttribute('aria-pressed',t.getAttribute('aria-pressed')!=='true');return}
 if('toggleSw' in d){t.setAttribute('aria-checked',t.getAttribute('aria-checked')!=='true');return}
 if(d.react){state.react[d.react]=!state.react[d.react];render('group');return}
 if(d.pray){state.prayers[+d.pray].st=d.st;toast(d.st==='ans'?'응답으로 표시했어요 🙏':'보관했어요');render('prayer');return}
 if('addPrayer' in d){state.prayers.unshift({t:'(새 기도제목 예시)',by:'나',st:'ing',d:'방금'});toast('그룹에 올렸어요');render('prayer');return}
 if(d.rsvp){state.rsvp=d.rsvp;toast('응답했어요 · 인원 수로만 표시');render('calendar');return}
 if('memory' in d){state.memory=!state.memory;render('library');return}
 if('perm' in d){permSheet();return}
 if(d.permSet){state.perm=d.permSet;render('notify');toast(d.permSet==='granted'?'알림을 켰어요 · 06:00':'알림함에서 확인할 수 있어요');return}
 if('installed' in d){state.installed=true;toast('설치됨으로 표시했어요');render('notify');return}
 if(d.plat){document.querySelectorAll('[data-plat]').forEach(b=>b.setAttribute('aria-pressed',b===t));renderPlat(d.plat);return}
 if(d.ver){document.querySelectorAll('[data-ver]').forEach(b=>b.setAttribute('aria-pressed',b===t));renderVer(d.ver);return}
 if(d.layer){document.querySelectorAll('[data-layer]').forEach(b=>b.setAttribute('aria-pressed',b===t));renderLayer(d.layer);return}
 if(d.wording){document.querySelectorAll('[data-wording]').forEach(b=>b.setAttribute('aria-pressed',b===t));document.getElementById('lockText').textContent=d.wording;return}
 if('ask' in d){ask(t.textContent.trim()||'‘심정’은 감정과 어떻게 달라요?');return}
 if(d.share){if(d.share==='img')toast('이미지로 저장했어요 · 출처 포함');else sheet(`<h4>공유</h4><p class="meta">공유 허용 콘텐츠만 나가요. 카드 이미지에 출처와 베타 표기가 들어가요.</p><div class="quick" style="margin:14px 0">${['카카오톡','인스타 스토리','메시지','링크 복사'].map(x=>`<a data-close data-toast="${x}(으)로 공유 · 예시">${I.share}${x}</a>`).join('')}</div><button class="btn s full" data-close>닫기</button>`);return}
 if('sum' in d){document.getElementById('sumBody').innerHTML=`<div class="lbl"><span class="badge ai">AI 요약</span> 2026-09-09 생성 · 입력 미보관</div><b>건강 2 · 가정 1 · 직장 1</b><p style="margin-top:6px">가족의 수술·검진을 앞둔 기도가 가장 많고, 구직·적응 관련 기도가 뒤를 잇습니다. 이름과 원문은 포함하지 않았습니다.</p><p class="meta" style="margin-top:8px">그룹 밖으로 공유되지 않아요 · 다시 만들기 가능</p>`;return}
 if(d.go){if('close' in d)closeSheet();go(d.go);return}
});
document.getElementById('sheetBg').addEventListener('click',closeSheet);
document.getElementById('btnTheme').addEventListener('click',e=>{const on=app.dataset.theme!=='dark';app.dataset.theme=on?'dark':'';e.currentTarget.setAttribute('aria-pressed',on)});
document.getElementById('btnBig').addEventListener('click',e=>{const on=!app.hasAttribute('data-big');on?app.setAttribute('data-big',''):app.removeAttribute('data-big');e.currentTarget.setAttribute('aria-pressed',on)});
document.getElementById('btnReset').addEventListener('click',()=>{Object.assign(state,{mood:'감사',saved:[],memory:false,react:{},perm:'default',installed:false,rsvp:null,_offered:false});state.prayers[2].st='ans';render('splash')});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='d'||e.key==='D')document.getElementById('btnTheme').click();if(e.key==='b'||e.key==='B')document.getElementById('btnBig').click();if(e.key==='ArrowLeft'){histStack.pop();const p=histStack.pop();if(p)render(p)}if(e.key==='Escape')closeSheet()});
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(h){const [id,opt]=h.split('.');if(opt==='dark'){app.dataset.theme='dark';document.getElementById('btnTheme').setAttribute('aria-pressed',true)}if(opt==='big'){app.setAttribute('data-big','');document.getElementById('btnBig').setAttribute('aria-pressed',true)}render(id)}});
const h0=location.hash.replace('#','');if(h0){const [id,opt]=h0.split('.');if(opt==='dark')app.dataset.theme='dark';if(opt==='big')app.setAttribute('data-big','');render(id)}else render('splash');
</script>
</body>
</html>
