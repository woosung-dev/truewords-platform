services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: qdrant
    restart: always
    expose:
      - "6333"
      - "6334"
    volumes:
      - /opt/qdrant/data:/qdrant/storage
      - /opt/qdrant/config:/qdrant/config
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
      - QDRANT__LOG_LEVEL=INFO
    mem_limit: 3g
    # RocksDB 가 segment SST 파일을 mmap 으로 열어두며 운영 시간 누적에 따라
    # open fd 가 컨테이너 default soft limit (1024) 에 도달 → "Too many open
    # files" panic 으로 자가 abort. docker restart 정책으로 재기동되지만 운영
    # 503 발생. 65536 으로 올려 누적을 흡수 (Qdrant 공식 권장).
    # 사고 RCA: docs/dev-log/2026-05-09-qdrant-ulimit-rca.md
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - qdrant_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - qdrant
    networks:
      - qdrant_net

networks:
  qdrant_net:
    driver: bridge
