name: API validation
on:
  workflow_call:
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.4"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run --frozen ruff check .
      # 레포 루트 pyrightconfig.json 대신 apps/api/pyproject.toml 설정·baseline 을 쓰도록 -p 로 고정한다
      - name: Basedpyright type check
        run: uv run --frozen basedpyright -p pyproject.toml
      - name: Full API regression suite
        env:
          GEMINI_API_KEY: test-key-for-ci
          EMBED_BATCH_SLEEP: "0.001"
        run: uv run pytest -v
