name: API validation
on:
  workflow_call:
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.4"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # dev 그룹만. eval 그룹(ragas·langchain·pandas)은 평가 스크립트 전용이고 CI 에 넣지 않는다.
      - run: uv sync --frozen
      - name: Full API regression suite
        env:
          GEMINI_API_KEY: test-key-for-ci
          EMBED_BATCH_SLEEP: "0.001"
        run: uv run pytest -v
