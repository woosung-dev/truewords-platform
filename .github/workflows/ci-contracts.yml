name: Contract validation
on:
  workflow_call:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --project apps/api
      - name: Regeneration drift and base-branch compatibility
        env:
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm contracts:check
      - run: pnpm --filter @truewords/api-client-ts test
      - run: pnpm typecheck
