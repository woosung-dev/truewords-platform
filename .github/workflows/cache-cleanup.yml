name: Semantic Cache Cleanup

# Qdrant 의 semantic_cache 컬렉션에서 TTL (CACHE_TTL_DAYS, 기본 7일) 만료된
# point 를 매일 자동 삭제. Qdrant 가 native point TTL 을 지원하지 않아 필요한
# 운영 작업.
#
# 인프라 무관성: GHA 가 외부 trigger 라 어느 환경에서도 동일 동작. 운영을 옮겨도
# secrets 의 QDRANT_URL/API_KEY 만 갱신하면 끝이다. 이 워크플로가 여기 있는 이유가
# 그것이고, Oracle 이전(2026-07-29) 때 잠깐 VM cron 으로 내렸다가 되돌렸다 —
# 정기 작업 orchestration 은 provider 에 묶지 않는다는 정책 (docs/06_devops/ci-cd-pipeline.md).
#
# GHA 가 멈춰 있는 동안(청구 차단 등) 이 작업이 안 돌아도 응답 정합성은 깨지지 않는다.
# 캐시 조회가 Qdrant filter 에서 `created_at >= now - TTL` 로 만료분을 걸러내므로
# (src/cache/service.py:89-94) 만료 point 는 서빙되지 않고 디스크만 차지한다.
# 수동 실행: `make cron-cache-cleanup` (VM 컨테이너 안에서 같은 스크립트 실행).
#
# 상세: docs/guides/semantic-cache-cleanup.md, docs/dev-log/55-semantic-cache-hardening.md

on:
  schedule:
    # 매일 03:00 KST = 18:00 UTC. 트래픽 가장 적은 시간대.
    - cron: "0 18 * * *"
  workflow_dispatch:
    # GHA 콘솔에서 수동 trigger 가능 (긴급 cleanup, 디버깅용).
    inputs:
      mode:
        description: "실행 모드"
        required: true
        default: "execute"
        type: choice
        options:
          - dry-run
          - execute
      ttl_days:
        description: "TTL override (기본: secrets/.env 의 CACHE_TTL_DAYS 또는 7)"
        required: false
        default: ""

jobs:
  cleanup:
    name: Run cleanup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # 실패 시 Issue 로 알린다 (아래 마지막 스텝)
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal deps (httpx only)
        # cleanup 스크립트는 raw httpx 만 사용. 전체 sync 는 과함.
        # 단 uv sync --frozen 이 lock 검증을 보장하므로 일관성 유지를 위해 사용.
        run: uv sync --frozen

      - name: Run cleanup
        env:
          # secrets 미설정 시 기본값 (local) 으로 fallback. 운영 적용 시
          # repo Settings → Secrets and variables → Actions 에 등록 필요.
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          CACHE_COLLECTION_NAME: ${{ vars.CACHE_COLLECTION_NAME || 'semantic_cache' }}
          CACHE_TTL_DAYS: ${{ vars.CACHE_TTL_DAYS || '7' }}
          # GEMINI_API_KEY 는 settings 검증 통과용. cleanup 자체는 미사용.
          GEMINI_API_KEY: not-used-by-cleanup-script
        run: |
          # workflow_dispatch 의 mode 입력 (수동 실행 시) 또는 schedule (자동) 시 execute.
          MODE="${{ github.event.inputs.mode || 'execute' }}"
          TTL_OVERRIDE="${{ github.event.inputs.ttl_days }}"

          ARGS="--$MODE"
          if [ -n "$TTL_OVERRIDE" ]; then
            ARGS="$ARGS --ttl-days $TTL_OVERRIDE"
          fi

          echo "Running: scripts/cleanup_semantic_cache.py $ARGS"
          uv run python scripts/cleanup_semantic_cache.py $ARGS

      # 실패를 사람이 알 수 있게 Issue 로 올린다. 예약 작업은 아무도 안 보고
      # 있어서, 조용히 실패하면 며칠이 지나간다 (2026-07-24~29 사고).
      #
      # Issue 를 쓰는 이유: 새 secret 이 없다 (GITHUB_TOKEN). 그리고 Actions
      # 실패 알림과 달리 Issue 는 알림이 확실히 만들어진다 — 그 사고 때
      # `gh api notifications?all=true` 는 빈 목록이었다.
      #
      # ⚠️ 이 스텝의 한계: **job 이 시작되지 못하면 이 스텝도 돌지 않는다.**
      # 청구 차단이 정확히 그 경우였고(실패 run 의 steps_count=0), 그래서
      # 이것만으로는 그 사고를 못 잡는다. 그 공백은 다른 실패 도메인에 있는
      # `infra/oracle-vm/ops-check.sh` (VM cron) 가 결과 기준으로 메운다.
      - name: 실패 시 Issue 로 알림
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        working-directory: .
        run: |
          TITLE="[ops-alert] Semantic Cache Cleanup 실패"
          BODY=$(printf '예약 작업이 실패했습니다.\n\n- run: %s\n- 시각: %s\n- trigger: %s\n\n확인: `make cron-cache-cleanup ARGS=--dry-run`\n운영 불변식 전반: `make ops-check`' \
            "$RUN_URL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.event_name }}")

          # 같은 제목의 열린 Issue 가 있으면 코멘트만 남긴다 — 매일 실패할 때
          # Issue 가 쌓이면 오히려 신호가 묻힌다.
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label ops-alert 2>/dev/null \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi
