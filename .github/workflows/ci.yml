name: CI

on:
  pull_request:
    branches: [main, "dev/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tooling/**'
              - '.github/workflows/**'
              - 'Makefile'
              - '.dockerignore'
            api:
              - *shared
              - 'apps/api/**'
              - 'contracts/**'
              - 'infra/**'
            web:
              - *shared
              - 'apps/web/**'
              - 'packages/**'
              - 'contracts/**'
              - 'apps/api/**'
              - 'tests/e2e/**'
            admin:
              - *shared
              - 'apps/admin/**'
              - 'packages/**'
              - 'contracts/**'
              - 'apps/api/**'
              - 'tests/e2e/**'
            contracts:
              - *shared
              - 'apps/api/**'
              - 'contracts/**'
              - 'packages/api-client-ts/**'

  backend-test:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/ci-api.yml

  frontend-test:
    name: Frontend Tests
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    uses: ./.github/workflows/ci-web.yml
    with:
      app: admin

  web-test:
    name: Web Tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/ci-web.yml
    with:
      app: web

  contracts:
    name: API contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    uses: ./.github/workflows/ci-contracts.yml

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tooling/checks/docs-links.mjs
      - run: node tooling/checks/boundaries.mjs
      - run: node --test tooling/checks/*.test.mjs
      - run: for script in infra/oracle-vm/*.sh; do bash -n "$script" || exit; done

  e2e:
    name: Cross-app E2E
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.admin == 'true'
    uses: ./.github/workflows/ci-e2e.yml

  required:
    name: CI Required
    needs: [changes, backend-test, frontend-test, web-test, contracts, repository, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reject failures, cancellation, or unexpected skips
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node tooling/checks/ci-status.mjs
