name: CI

on:
  pull_request:
    branches: [main, "dev/**"]
  # main push: 머지 결과 자체의 green 증거를 남긴다. 08-30 처럼 CI 가 시작조차 못 한 채
  # 머지된 경우와 rebase 없이 머지된 조합을 사후에라도 잡고, make deploy-guard 의
  # "main 에 있는 커밋만 배포" 규칙에 근거를 준다.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # PR 은 새 push 가 이전 run 을 대체한다. main push 는 각 커밋의 결과를 남겨야 하므로 취소하지 않는다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    # PR 이 아닐 때(main push·수동 실행)는 변경 감지를 건너뛰고 전부 실행한다.
    # 필터가 "변경 없음" 을 내면 모든 검사가 skip 인 채 CI Required 가 초록이 되는 함정을 피한다.
    outputs:
      api: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.api }}
      web: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.web }}
      admin: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.admin }}
      contracts: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tooling/**'
              - '.github/workflows/**'
              - 'Makefile'
              - '.dockerignore'
            api:
              - *shared
              - 'apps/api/**'
              - 'contracts/**'
              - 'infra/**'
            web:
              - *shared
              - 'apps/web/**'
              - 'packages/**'
              - 'contracts/**'
              - 'apps/api/**'
              - 'tests/e2e/**'
            admin:
              - *shared
              - 'apps/admin/**'
              - 'packages/**'
              - 'contracts/**'
              - 'apps/api/**'
              - 'tests/e2e/**'
            contracts:
              - *shared
              - 'apps/api/**'
              - 'contracts/**'
              - 'packages/api-client-ts/**'

  backend-test:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/ci-api.yml

  frontend-test:
    name: Frontend Tests
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    uses: ./.github/workflows/ci-web.yml
    with:
      app: admin

  web-test:
    name: Web Tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/ci-web.yml
    with:
      app: web

  contracts:
    name: API contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    uses: ./.github/workflows/ci-contracts.yml

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node tooling/checks/docs-links.mjs
      - run: node tooling/checks/boundaries.mjs
      - run: node --test tooling/checks/*.test.mjs
      - run: for script in infra/oracle-vm/*.sh; do bash -n "$script" || exit; done

  e2e:
    name: Cross-app E2E
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.admin == 'true'
    uses: ./.github/workflows/ci-e2e.yml

  required:
    name: CI Required
    needs: [changes, backend-test, frontend-test, web-test, contracts, repository, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Reject failures, cancellation, or unexpected skips
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node tooling/checks/ci-status.mjs
