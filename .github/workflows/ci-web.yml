name: Web client validation
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate app and shared dependencies
        env:
          APP: ${{ inputs.app }}
        run: |
          pnpm exec turbo run test lint --filter="@truewords/${APP}..."
          pnpm exec turbo run build --filter="@truewords/${APP}"
          pnpm exec turbo run typecheck --filter="@truewords/${APP}..."
