[project]
name = "truewords-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "qdrant-client[fastembed]>=1.19.0",
    "google-genai>=2.34.0",
    "pydantic-settings>=2.16.2",
    "httpx>=0.27.0",
    # PostgreSQL
    "sqlmodel>=0.0.48",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "greenlet>=3.5.6",
    # Auth
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "kss>=6.0.6",
    "python-multipart>=0.0.22",
    "pywebpush>=2.5.0",
    "langchain-text-splitters>=1.1.3",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "openpyxl>=3.1.5",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-mock>=3.17.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
