[project]
name = "truewords-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "qdrant-client[fastembed]>=1.19.0",
    "google-genai>=0.8.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    # PostgreSQL
    "sqlmodel>=0.0.47",
    "asyncpg>=0.30.0",
    "alembic>=1.19.1",
    "greenlet>=3.5.5",
    # Auth
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "kss>=6.0.6",
    "python-multipart>=0.0.22",
    "pywebpush>=2.5.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "openpyxl>=3.1.5",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.14.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
